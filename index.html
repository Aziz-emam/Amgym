<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <title>نظام إدارة النادي الرياضي النسائي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'sans-serif'] },
          colors: {
            primary: 'var(--color-primary)',
            'primary-dark': 'var(--color-primary-dark)',
            secondary: 'var(--color-secondary)',
            accent: 'var(--color-accent)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-slate-800 dark:text-slate-100 font-sans min-h-screen overflow-x-hidden">

  <!-- خلفيات الثيمات الخمس · يظهر واحد حسب data-bg-theme -->
  <div id="app-bg" aria-hidden="true">
    <div class="ring1"></div>
    <div class="ring2"></div>

    <!-- 1) أوزان -->
    <div class="bg-pack" data-pack="weights">
      <div class="motif m1"><svg viewBox="0 0 64 64" fill="none"><rect x="6" y="22" width="10" height="20" rx="2" stroke="currentColor" stroke-width="2"/><rect x="48" y="22" width="10" height="20" rx="2" stroke="currentColor" stroke-width="2"/><rect x="14" y="26" width="6" height="12" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="44" y="26" width="6" height="12" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="20" y="30" width="24" height="4" rx="1.5" fill="currentColor" opacity="0.85"/></svg></div>
      <div class="motif m2"><svg viewBox="0 0 64 64" fill="none"><line x1="8" y1="32" x2="56" y2="32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><rect x="4" y="24" width="8" height="16" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="52" y="24" width="8" height="16" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="12" y="27" width="5" height="10" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="47" y="27" width="5" height="10" rx="1" stroke="currentColor" stroke-width="1.4"/></svg></div>
      <div class="motif m3"><svg viewBox="0 0 64 64" fill="none"><circle cx="18" cy="32" r="10" stroke="currentColor" stroke-width="2"/><circle cx="46" cy="32" r="10" stroke="currentColor" stroke-width="2"/><rect x="26" y="29" width="12" height="6" rx="1" fill="currentColor" opacity="0.7"/></svg></div>
      <div class="motif m4"><svg viewBox="0 0 64 64" fill="none"><rect x="6" y="20" width="8" height="24" rx="2" stroke="currentColor" stroke-width="2"/><rect x="50" y="20" width="8" height="24" rx="2" stroke="currentColor" stroke-width="2"/><line x1="14" y1="32" x2="50" y2="32" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
      <div class="motif m5"><svg viewBox="0 0 64 64" fill="none"><rect x="8" y="24" width="12" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="44" y="24" width="12" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="22" y="30" width="20" height="4" rx="1" fill="currentColor" opacity="0.75"/></svg></div>

    </div>

    <!-- 2) كارديو -->
    <div class="bg-pack" data-pack="cardio">
      <div class="motif m1"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="20" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><circle cx="32" cy="32" r="12" stroke="currentColor" stroke-width="1.5" opacity="0.7"/><circle cx="32" cy="12" r="3.5" fill="currentColor" opacity="0.55"/></svg></div>
      <div class="motif m2"><svg viewBox="0 0 64 64" fill="none"><path d="M8 40 Q20 12 32 32 Q44 52 56 24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="56" cy="24" r="3" fill="currentColor" opacity="0.5"/></svg></div>
      <div class="motif m3"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="18" stroke="currentColor" stroke-width="2"/><path d="M32 14 L32 32 L44 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div class="motif m4"><svg viewBox="0 0 64 64" fill="none"><path d="M6 48 C18 20, 28 20, 32 36 C36 52, 46 52, 58 24" stroke="currentColor" stroke-width="2" fill="none"/><path d="M10 50 C20 28, 30 28, 34 40" stroke="currentColor" stroke-width="1.4" fill="none" opacity="0.5"/></svg></div>
      <div class="motif m5"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="16" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 6"/><circle cx="32" cy="32" r="6" fill="currentColor" opacity="0.25"/><circle cx="48" cy="20" r="4" stroke="currentColor" stroke-width="1.5"/></svg></div>

      <div class="motif m2"><svg viewBox="0 0 64 64" fill="none"><path d="M10 44 C22 18, 42 18, 54 44" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M16 44 C26 26, 38 26, 48 44" stroke="currentColor" stroke-width="1.3" fill="none" opacity="0.55"/></svg></div>
      <div class="motif m3"><svg viewBox="0 0 64 64" fill="none"><path d="M32 10 C20 28, 20 40, 32 54 C44 40, 44 28, 32 10 Z" stroke="currentColor" stroke-width="1.6" fill="currentColor" fill-opacity="0.08"/></svg></div>
      <div class="motif m4"><svg viewBox="0 0 64 64" fill="none"><circle cx="22" cy="28" r="12" stroke="currentColor" stroke-width="1.5" opacity="0.55"/><circle cx="42" cy="36" r="12" stroke="currentColor" stroke-width="1.5" opacity="0.55"/><circle cx="32" cy="24" r="10" stroke="currentColor" stroke-width="1.5"/></svg></div>
      <div class="motif m5"><svg viewBox="0 0 64 64" fill="none"><path d="M8 32 H56" stroke="currentColor" stroke-width="1.2" opacity="0.35"/><path d="M12 24 C24 12, 40 12, 52 24" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 40 C24 52, 40 52, 52 40" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></div>

    </div>

    <!-- 4) هندسي رياضي -->
    <div class="bg-pack" data-pack="geometric">
      <div class="motif m1"><svg viewBox="0 0 64 64" fill="none"><rect x="18" y="8" width="28" height="6" rx="2" stroke="currentColor" stroke-width="1.8"/><line x1="24" y1="14" x2="20" y2="48" stroke="currentColor" stroke-width="2"/><line x1="40" y1="14" x2="44" y2="48" stroke="currentColor" stroke-width="2"/><rect x="12" y="48" width="16" height="5" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="36" y="48" width="16" height="5" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg></div>
      <div class="motif m2"><svg viewBox="0 0 64 64" fill="none"><rect x="12" y="12" width="40" height="40" rx="4" stroke="currentColor" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="22" y="22" width="20" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/></svg></div>
      <div class="motif m3"><svg viewBox="0 0 64 64" fill="none"><polygon points="32,8 56,48 8,48" stroke="currentColor" stroke-width="1.8" fill="none"/><polygon points="32,20 46,44 18,44" stroke="currentColor" stroke-width="1.3" fill="none" opacity="0.55"/></svg></div>
      <div class="motif m4"><svg viewBox="0 0 64 64" fill="none"><path d="M10 50 L10 20 L32 10 L54 20 L54 50 Z" stroke="currentColor" stroke-width="1.7" fill="none"/><line x1="10" y1="20" x2="54" y2="20" stroke="currentColor" stroke-width="1.2" opacity="0.5"/></svg></div>
      <div class="motif m5"><svg viewBox="0 0 64 64" fill="none"><line x1="8" y1="16" x2="56" y2="16" stroke="currentColor" stroke-width="1.2" opacity="0.4"/><line x1="8" y1="32" x2="56" y2="32" stroke="currentColor" stroke-width="1.2" opacity="0.4"/><line x1="8" y1="48" x2="56" y2="48" stroke="currentColor" stroke-width="1.2" opacity="0.4"/><rect x="20" y="20" width="24" height="24" stroke="currentColor" stroke-width="1.8"/></svg></div>
      <div class="motif m6"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="16" stroke="currentColor" stroke-width="1.5"/><rect x="24" y="24" width="16" height="16" stroke="currentColor" stroke-width="1.5" transform="rotate(45 32 32)"/></svg></div>
    </div>

    <!-- 5) بسيط -->
    <div class="bg-pack" data-pack="minimal">
      <div class="motif m1"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="20" stroke="currentColor" stroke-width="1.5" opacity="0.5"/></svg></div>
      <div class="motif m2"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="16" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.45"/></svg></div>
      <div class="motif m3"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="12" stroke="currentColor" stroke-width="1.3" opacity="0.35"/></svg></div>
      <div class="motif m4" style="display:none"></div>
      <div class="motif m5" style="display:none"></div>
      <div class="motif m6" style="display:none"></div>
    </div>
  </div>

  <!-- شعار ثابت أسفل يسار -->
  <div id="app-signature" class="fixed bottom-3 left-3 z-50 opacity-80 hover:opacity-100 transition-opacity cursor-default select-none" title="شعار النظام">
    <img src="assets/am-logo.jpg" alt="Logo" width="40" height="40" class="signature-logo" draggable="false" />
  </div>

  <!-- App Root -->
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Top Bar -->
    <header class="app-header sticky top-0 z-40">
      <div class="flex items-center justify-between px-4 py-3 max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
          <button id="menu-btn" class="p-2 rounded-xl hover:bg-slate-100/80 dark:hover:bg-slate-700/80 lg:hidden">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <button type="button" onclick="navigate('dashboard')" class="flex items-center gap-2 hover:opacity-90 transition text-right" title="الصفحة الرئيسية">
            <div id="club-logo" class="w-10 h-10 rounded-full bg-teal-600 flex items-center justify-center text-white font-bold text-lg shadow">ن</div>
            <div>
              <h1 id="club-name" class="font-bold text-lg leading-tight text-teal-700 dark:text-teal-300">نادي اللياقة النسائي</h1>
              <p class="text-xs text-slate-500 dark:text-slate-400">نظام الإدارة المتكامل</p>
            </div>
          </button>
        </div>
        <div class="flex items-center gap-2">
          <button id="theme-toggle" class="p-2 rounded-xl hover:bg-slate-100/80 dark:hover:bg-slate-700/80" title="تغيير المظهر">
            <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </button>
          <div id="current-user" class="hidden sm:flex items-center gap-2 text-sm bg-teal-50/90 dark:bg-teal-900/40 px-3 py-1.5 rounded-full border border-teal-100/80 dark:border-teal-800/50">
            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
            <span>مديرة النظام</span>
          </div>
        </div>
      </div>
    </header>

    <div class="flex flex-1 max-w-7xl mx-auto w-full relative z-[1]">

      <aside id="sidebar" class="fixed lg:static inset-y-0 right-0 z-30 w-64 border-l transform translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl lg:shadow-none overflow-y-auto">

            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>

          <a href="#present" data-page="present" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>

            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            الموظفات والمدربات
          </a>
          <a href="#salaries" data-page="salaries" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>

            المصروفات
          </a>
          <a href="#reports" data-page="reports" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            التقارير
          </a>
          <a href="#notifications" data-page="notifications" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">

      <!-- Overlay for mobile -->
      <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-20 hidden lg:hidden"></div>

      <!-- Main Content -->
      <main id="main-content" class="flex-1 p-4 lg:p-6 overflow-y-auto pb-20">
        <!-- Pages will be injected here -->
      </main>
    </div>
