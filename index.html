<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <title>نظام إدارة النادي الرياضي النسائي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'sans-serif'] },
          colors: {
            primary: 'var(--color-primary)',
            'primary-dark': 'var(--color-primary-dark)',
            secondary: 'var(--color-secondary)',
            accent: 'var(--color-accent)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen overflow-x-hidden">
  <!-- Signature fixed bottom-left -->
  <div id="app-signature" class="fixed bottom-3 left-3 z-50 opacity-70 hover:opacity-100 transition-opacity cursor-default select-none" title="AM - نظام إدارة النادي">
    <svg width="36" height="36" viewBox="0 0 100 100" class="signature-svg">
      <!-- Intertwined A and M professional monogram -->
      <defs>
        <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--sig-color1)" />
          <stop offset="100%" stop-color="var(--sig-color2)" />
        </linearGradient>
      </defs>
      <!-- Outer circle subtle -->
      <circle cx="50" cy="50" r="46" fill="none" stroke="url(#sigGrad)" stroke-width="2.5" opacity="0.4"/>
      <!-- Letter A (left part) -->
      <path d="M28 78 L42 22 L56 78 M34 58 L50 58" fill="none" stroke="url(#sigGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Letter M overlapping/intertwined -->
      <path d="M48 78 L48 28 L62 55 L76 28 L76 78" fill="none" stroke="url(#sigGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Small center accent -->
      <circle cx="50" cy="50" r="3.5" fill="url(#sigGrad)"/>
    </svg>
  </div>

  <!-- App Root -->
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Top Bar -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm">
      <div class="flex items-center justify-between px-4 py-3 max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
          <button id="menu-btn" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 lg:hidden">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="flex items-center gap-2">
            <div id="club-logo" class="w-10 h-10 rounded-full bg-teal-600 flex items-center justify-center text-white font-bold text-lg shadow">ن</div>
            <div>
              <h1 id="club-name" class="font-bold text-lg leading-tight text-teal-700 dark:text-teal-300">نادي اللياقة النسائي</h1>
              <p class="text-xs text-slate-500 dark:text-slate-400">نظام الإدارة المتكامل</p>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="theme-toggle" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700" title="تغيير المظهر">
            <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </button>
          <div id="current-user" class="hidden sm:flex items-center gap-2 text-sm bg-teal-50 dark:bg-teal-900/40 px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
            <span>مديرة النظام</span>
          </div>
        </div>
      </div>
    </header>

    <div class="flex flex-1 max-w-7xl mx-auto w-full">
      <!-- Sidebar -->
      <aside id="sidebar" class="fixed lg:static inset-y-0 right-0 z-30 w-64 bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 transform translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl lg:shadow-none overflow-y-auto">
        <nav class="p-4 space-y-1 mt-16 lg:mt-4">
          <a href="#dashboard" data-page="dashboard" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            الرئيسية
          </a>
          <a href="#members" data-page="members" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            المشتركات
          </a>
          <a href="#attendance" data-page="attendance" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
            الحضور والانصراف
          </a>
          <a href="#present" data-page="present" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            المتواجدات حالياً
          </a>
          <a href="#subscriptions" data-page="subscriptions" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            تسعير الاشتراكات
          </a>
          <a href="#employees" data-page="employees" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            الموظفات والمدربات
          </a>
          <a href="#salaries" data-page="salaries" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            الرواتب
          </a>
          <a href="#expenses" data-page="expenses" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z"/></svg>
            المصروفات
          </a>
          <a href="#reports" data-page="reports" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            التقارير
          </a>
          <a href="#shifts" data-page="shifts" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            الورديات
          </a>
          <a href="#settings" data-page="settings" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            الإعدادات
          </a>
        </nav>
        <div class="p-4 border-t border-slate-200 dark:border-slate-700 mt-4">
          <p class="text-xs text-slate-400 text-center">الإصدار 1.0 • تجريبي</p>
        </div>
      </aside>

      <!-- Overlay for mobile -->
      <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-20 hidden lg:hidden"></div>

      <!-- Main Content -->
      <main id="main-content" class="flex-1 p-4 lg:p-6 overflow-y-auto pb-20">
        <!-- Pages will be injected here -->
      </main>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 space-y-2 pointer-events-none"></div>

  <!-- Modals container -->
  <div id="modals"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
